[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "kindle-to-readwise"
version = "1.0.0"
description = "Convert Kindle highlight exports to beautifully formatted Readwise imports"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [
    {name = "Sameer Bajaj", email = "sameer@sameerbajaj.com"},
]
keywords = [
    "kindle",
    "readwise",
    "highlights",
    "notes",
    "converter",
    "book-notes",
    "cli",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Text Processing :: Markup :: HTML",
    "Topic :: Utilities",
]
dependencies = [
    "pandas>=1.3.0",
    "beautifulsoup4>=4.9.3",
    "requests>=2.25.1",
    "lxml>=4.6.3",
]

[project.urls]
Homepage = "https://sameerbajaj.com/tools/kindle/"
Website = "https://sameerbajaj.com"
Repository = "https://github.com/sameerbajaj/kindle-to-readwise"

[project.scripts]
kindle-to-readwise = "kindle_to_readwise:main"

[tool.setuptools]
py-modules = ["kindle_to_readwise", "kindle_to_readwise_standalone"]
